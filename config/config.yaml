project:
  name: pricing-intelligence-system
  default_ticker: AAPL

data:
  start_date: "2020-01-01"
  end_date: "2025-01-01"
  interval: "1d"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  ingestion_timeout_seconds: 30
  ingestion_max_retries: 3
  allow_cache_fallback: false
  demo_mode: false

modeling:
  include_sentiment: true
  use_transformer_sentiment: true

agentic:
  model: "gpt-5.6-terra"
  max_steps: 12
  max_revision_cycles: 1
  tracing_enabled: true
  tool_timeout_seconds: 20

rag:
  top_k: 6
  local_store: "data/vector_store/evidence.json"
  qdrant_collection: "pricing_evidence"

mcp:
  enabled: true
  read_only: true

outputs:
  base_dir: "outputs"
